name: Android APK

# Builds the Android app (debug APK) and attaches it to the run as a download.
# Free on public repositories.
on:
  push:
    paths: ["android/**", "static/**", "templates/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "static/**", "templates/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android/android
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
